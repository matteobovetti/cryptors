name: Benchmarks

# Manual only. Shared runners are too noisy for benchmark numbers to gate a
# merge, but they are the only real x86 hardware -- and the only non-Apple
# aarch64 -- the project has. Compare figures *within* one job, where cryptors
# and Go ran on the same machine minutes apart, never across jobs or runs.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Benchmark (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # x86-64: where every single-message SHA-3 digest and every 64-bit
        # SHA-2 digest (SHA-384, SHA-512, SHA-512/t) runs on the scalar
        # backend, and where SHA-224/SHA-256 use SHA-NI if the runner's CPU has
        # it. The SHA-256 throughput test also times the AVX2, BMI and baseline
        # scalar backends, the paths CPUs without SHA-NI take. AES uses AES-NI,
        # with the scalar backend timed beside it. aarch64: whether
        # FEAT_SHA3, if the runner has it, still beats scalar on a non-Apple
        # core -- Go's crypto/sha3 assumes it doesn't -- and whether FEAT_SHA512
        # (reported under the same feature) does the same for SHA-512. AES uses
        # FEAT_AES where the runner has it. DES and TDEA have no hardware
        # backend: the same portable code is timed on both architectures. So
        # does ECDH. Go's crypto/ecdh has assembly for P-256 on both
        # architectures and for X25519 on x86-64 only, so its `purego` run is
        # the like-for-like one there; P-384 and P-521 are portable code in Go
        # too. On x86-64 our field arithmetic compiles to `mulq` and does not
        # use BMI2 or ADX even where the runner has them (`lscpu` says).
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: actions/setup-go@v7
        with:
          go-version-file: bench/sha3cmp/go.mod
          # The bench modules have no dependencies, so nothing to cache.
          cache: false
      # The model and feature flags, so each set of numbers can be tied to the
      # CPU that produced it.
      - run: lscpu
      - run: make bench-throughput
      - run: make bench-go
