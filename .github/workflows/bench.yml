name: Benchmarks

# Manual only. Shared runners are too noisy for benchmark numbers to gate a
# merge, but they are the only real x86 hardware -- and the only non-Apple
# aarch64 -- the project has. Compare figures *within* one job, where cryptors
# and Go ran on the same machine minutes apart, never across jobs or runs.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Benchmark (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        # x86-64: where every single-message SHA-3 digest and every 64-bit
        # SHA-2 digest (SHA-384, SHA-512, SHA-512/t) runs on the scalar
        # backend, and where SHA-224/SHA-256 use SHA-NI if the runner's CPU has
        # it. The SHA-256 throughput test also times the AVX2, BMI and baseline
        # scalar backends, the paths CPUs without SHA-NI take. AES uses AES-NI,
        # with the scalar backend timed beside it. aarch64: whether
        # FEAT_SHA3, if the runner has it, still beats scalar on a non-Apple
        # core -- Go's crypto/sha3 assumes it doesn't -- and whether FEAT_SHA512
        # (reported under the same feature) does the same for SHA-512. AES uses
        # FEAT_AES where the runner has it. DES and TDEA have no hardware
        # backend: the same portable code is timed on both architectures. So
        # do ECDH and ECDSA. Go's crypto/ecdh has assembly for P-256 on both
        # architectures and for X25519 on x86-64 only, and crypto/ecdsa for
        # P-256 on both, so their `purego` runs are the like-for-like ones
        # there; the other curves are portable code in Go too. On x86-64 our
        # field arithmetic compiles to `mulq` and does not use BMI2 or ADX even
        # where the runner has them (`lscpu` says).
        # Ed25519 has no hardware path on either; on x86-64 Go's field
        # multiplication is assembly and ours is not, so its `purego` run is
        # the like-for-like one there.
        # HMAC has no backend of its own: it runs on whatever SHA-1 and SHA-2
        # select on the runner (on x86-64, SHA-NI for SHA-1 and SHA-256 where
        # the CPU has it, and the scalar backend for MD5 and the 64-bit SHA-2
        # functions), and Go's crypto/hmac on Go's hashes, so its figures
        # follow the hashes'.
        # HKDF has no backend of its own either: it times HMAC-SHA256 and
        # HMAC-SHA512, so it runs on whichever SHA-2 backends the runner has,
        # on both sides.
        # PBKDF2 is the same: it times HMAC-SHA1, HMAC-SHA256 and HMAC-SHA512
        # in a loop, so it runs on whichever SHA-1 and SHA-2 backends the runner
        # has, on both sides (on x86-64, SHA-NI for SHA-1 and SHA-256 where the
        # CPU has it, and the scalar backend for SHA-512).
        # Rand has none either: both sides ask the operating system for the
        # bytes, getrandom(2) on these runners, so its figures follow the
        # kernel's.
        # RC4 has no hardware backend: the same portable code is timed on both
        # architectures, against Go's crypto/rc4, which is portable code too.
        # RSA has no hardware path: its big-number arithmetic is portable code on
        # both architectures (the 64 by 64 to 128 bit product that `u128` makes), against
        # Go's crypto/rsa, whose multiplication of a number by a word has assembly for
        # moduli of 1,024, 1,536 and 2,048 bits on both; its `purego` run is the
        # like-for-like one. Key generation uses the 708 candidates of
        # c2sp.org/CCTV/keygen on both sides, so the search is the same.
        # ML-DSA has no hardware path of its own: its transform is portable code
        # on both architectures, and the SHAKE under it runs on whatever SHA-3
        # backend the runner has (FEAT_SHA3 on aarch64 where present, the scalar
        # build otherwise, and on x86-64 the BMI build where the CPU has BMI1
        # and BMI2). Go's crypto/mldsa is portable code over a Keccak that is
        # assembly on x86-64 but, on Arm, only on Apple's cores (Go finds the
        # SHA-3 instructions slower than its portable code elsewhere), and its
        # `purego` run swaps only that.
        # ML-KEM is the same: portable lattice arithmetic on both architectures,
        # over whatever SHA-3 backend the runner has, against Go's crypto/mlkem
        # (ML-KEM-768 and ML-KEM-1024; Go has no ML-KEM-512), which is portable
        # code over the same Keccak as its ML-DSA, and whose `purego` run swaps
        # only that.
        # HPKE's AES-GCM uses PCLMULQDQ on x86-64 and PMULL on aarch64 where
        # the runner has them, and its throughput test times the scalar GHASH
        # beside them. Unlike on macOS, AES is not in either target's baseline
        # there, so the counter mode reaches the AES backend through the
        # run-time dispatcher once per block; the figures show what that costs.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: actions/setup-go@v7
        with:
          go-version-file: bench/sha3cmp/go.mod
          # The bench modules have no dependencies, so nothing to cache.
          cache: false
      # The model and feature flags, so each set of numbers can be tied to the
      # CPU that produced it.
      - run: lscpu
      - run: make bench-throughput
      - run: make bench-go
